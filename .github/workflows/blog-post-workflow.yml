name: Latest blog posts

on:
  schedule:
    - cron: '0 6 * * *'   # runs every day at 6:00 AM UTC
  workflow_dispatch:        # lets you trigger it manually from GitHub UI

jobs:
  update-readme:
    name: Update README with latest posts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest posts from sharpbyte.dev
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://www.sharpbyte.dev/feed.xml"
          max_post_count: 5
          readme_path: README.md
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore: update latest blog posts from sharpbyte.dev"
